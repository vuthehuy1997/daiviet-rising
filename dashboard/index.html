const D={"docs": [{"group": "Trạng thái & phê duyệt", "path": "state/APPROVALS.md", "text": "# Approvals\n## G1 — Concept approval\n- Date: 2026-10-21\n- Approver: user (as entered in session)\n- Exact words: \"approve G1: chọn cả 3 concept, về cơ bản demacia rising là mở rộng lãnh thổ, kèm phòng thủ các thành thị trong 1 vài lượt mà mandi hoặc noxus tấn công, tìm hiểu demacia rising sâu hơn đi,\"\n- Scope as recorded: Concept A + B + C (all three) are accepted as the concept direction. User states the reference's essence = territory expansion + defending towns within a few turns when attacked.\n- Not decided by this approval: how the three concepts combine / MVP ordering (agent will propose in Phase 2 for G2 review); the term \"mandi\" (unverified).\n- Baseline: none yet. G2 pending.\n\n## G2 — Design baseline approval\n- Date: 2026-10-21\n- Approver: user (as entered in session)\n- Exact words: \"approve G2\" (initial message, no baseline named) → confirmed via explicit question: \"Duyệt DB-0.1 nguyên trạng\"; local git init: \"Có, git init cục bộ\".\n- Baseline: **DB-0.1** (docs/design/BASELINE_CANDIDATE.md, docs/design/01..05, game-data/, docs/production/BACKLOG.yaml). Approved as-is including the 6 proposals (MVP=CMP-01 first; no end-turn fee; self-defined win/lose SYS-12; TypeScript+Vite+SVG; \"Mandi\" excluded; all numbers placeholder).\n- Also authorized: local `git init` in this directory (no remote push, no deploy).\n- Not authorized: remote push, production deploy, purchases (G3 pending).\n", "kind": "md"}, {"group": "Trạng thái & phê duyệt", "path": "state/CHANGELOG.md", "text": "# Changelog\n- Project initialized.\n- 2026-10-21: Phase 0 intake + Phase 1 research và 3 concept (A/B/C) được tạo trong `docs/`. Dừng tại G1.\n- 2026-10-21: G1 approved (all 3 concepts). Added docs/research/REFERENCE_DEEP_DIVE.md.\n- 2026-10-21: Phase 2–3: docs/design/01..05, BASELINE_CANDIDATE (DB-0.1), game-data/, BACKLOG, ROADMAP, tools/, dashboard/, docs/qa evidence. Dừng t ath": "state/STATUS.md", "text": "# Status\nUpdated: 2026-10-21\nPhase: 5 complete — Release Candidate RC1 (CMP-01) built and tested locally\nGate: **G3 — AWAITING USER DECISION** (chưa có phê duyệt G3; chưa deploy)\nBaseline: DB-0.1 (G2 approved) + CR-001 (balance/clarification changes, cần user xác nhận)\nImplementation repo: this directory (local git, branch main, tag rc1; no remote; no push)\nEvidence (docs/qa/EVIDENCE_rc1.txt): typecheck OK; check_design OK; vitest 48/48; build OK (137 kB JS); Playwright Chromium desktop+Pixel7: 19 passed/1 skipped; axe 0 serious/critical; bot balance idle/turtle/sprawl 0%, expand 52%.\nBacklog: 13 done, 7 partial, 0 todo (docs/production/BACKLOG.yaml).\nNOT done: manual human playtest; real GitHub Pages deploy; Firefox/Safari/real devices; screen-reader test; history expert review; reference video.\nBlockers: none for local; G3 needs explicit release target (none specified).\nNext: user reads docs/release/RC1.md, plays `npm run dev` / dist, then `approve G3: <target>` or requests changes (`update game: ...`).\n", "kind": "md"}, {"group": "Nghiên cứu", "path": "docs/research/HISTORY_SETTING.md", "text": "# Nghiên cứu bối cảnh lịch sử Đại Việt (sơ bộ cho G1)\n\nNgày truy cập: 2026-10-21. Độ tin cậy: **trung bình-thấp** — chủ yếu Wikipedia tiếng Anh và bài báo; số liệu quân/thương vong **không dùng làm thông số game** nếu chưa đối chiếu sử liệu tiếng Việt (*Đại Việt sử ký toàn thư*, *Việt sử lược*) và sử liệu Trung Hoa. Cần vòng nghiên cứu sâu ở Phase 2 (cố vấn sử học nếu có).\n\n## Nguồn\n| ID | URL |\n|---|---|\n| H1 | https://en.wikipedia.org/wiki/Song%E2%80%93%C4%90%E1%BA%A1i_Vi%E1%BB%87t_war |\n| H2 | https://en.wikipedia.org/wiki/Battle_of_Nh%C6%B0_Nguy%E1%BB%87t_River_(1077) |\n| H3 | https://en.wikipedia.org/wiki/Mongol_invasions_of_Vietnam |\n| H4 | https://en.wikipedia.org/wiki/Battle_of_B%E1%BA%A1ch_%C4%90%E1%BA%B1ng_(1288) |\n| H5 | https://en.wikipedia.org/wiki/Tr%E1%BA%A7n_dynasty_military_tactics_and_organization |\n| H6 | https://en.wikipedia.org/wiki/Champa%E2%80%93%C4%90%E1%BA%A1i_Vi%E1%BB%87t_War_(1471) |\n| H7 | https://en.wikipedia.org/wiki/Nam_ti%E1%BA%BFn |\n| H8 | https://tapchiqptd.vn/en/research-and-discussion/the-thought-of-strike-first-in-the-war-against-song-aggressors-1075-–-1077/8109.html |\n\n## Các giai đoạn ứng viên\n| Giai đoạn | Sự kiện chính (đã có nguồn) | Chất liệu gameplay | Lưu ý |\n|---|---|---|---|\n| Lý–Tống 1075–1077 | Đại Việt chủ động tấn công trước (H8), phòng tuyến sông Như Nguyệt (≈18/01–28/02/1077, H2), giảng hòa, thơ *Nam quốc sơn hà* | Phòng tuyến sông, tiên phát chế nhân, ngoại giao kết thúc | Nguồn lệch ngày/chi tiết (1075 vs 1077); số tổn thất chưa xác minh |\n| Trần–Mông Nguyên 1258/1285/1288 | 3 cuộc xâm lược; Bạch Đằng 09/04/1288 phục kích thủy chiến (H3, H4); Trần Hưng Đạo, Trần Khánh Dư | Thủy chiến, \"vườn không nhà trống\", hậu cần, đánh theo mùa | Cách đánh số \"lần thứ 2/3\" khác nhau; số quân dao động 94.000 vs 50.000 tùy nguồn |\n| Nam tiến (thế kỷ XV → XIX) | Lê Thánh Tông chiếm Vijaya 1471 (H6); Champa thu về Panduranga; quá trình kéo dài đến 1832 (H7) | Mở rộng, định cư, ngoại giao Champa/Khmer | **Nhạy cảm**: nguồn nêu bạo lực với dân thường (con số 60.000/30.000/40.000 không thống nhất); cần diễn đạt có chiều sâu, không đồng nhất hóa dân tộc hiện đại với đối thủ lịch sử |\n\n## Khoảng trống cần nghiên cứu (Phase 2)\n- Quân chế, vũ khí, thành lũy, thuyền chiến từng thời; địa hình thật của các tuyến (Như Nguyệt, Bạch Đằng, Chi Lăng...).\n- Kinh tế nông nghiệp/đê điều/thương mại; quan hệ Champa, Khmer, Đại Lý, Tống/Nguyên/Minh.\n- Giai đoạn khác chưa khảo sát: Ngô Quyền 938, Đinh–Lê 981, Lam Sơn/Minh, Tây Sơn.\n\n## Nguyên tắc bắt buộc (từ `game.yaml`)\nGắn nhãn mỗi nội dung: `[SOURCED]` / `[FICTION]` / `[ALT-HISTORY]`; không gộp các cuộc chiến cách nhau nhiều thế kỷ mà không giải thích; không đồng nhất dân tộc hiện đại với đối thủ lịch sử.\n", "kind": "md"}, {"group": "Nghiên cứu", "path": "docs/research/REFERENCE_DEEP_DIVE.md", "text": "# Demacia Rising — nghiên cứu sâu (bổ sung)\n\nNgày truy cập: 2026-10-21. Bổ sung cho `REFERENCE_DEMACIA_RISING.md`. Độ tin cậy: **trung bình**; vẫn chưa xem video/chơi thử. Số liệu từ guide ghi nhận từ ~200–260 ngày trước và **có thể đã đổi theo patch**.\n\n## Nguồn mới\n| ID | Nguồn | Tin cậy | Ghi chú |\n|---|---|---|---|\n| S1 | https://support.riotgames.com/en-us/league-of-legends/events/league-of-legends-demacia-rising-metagame | Cao | Chính thức |\n| S3 | https://www.thespike.gg/league-of-legends/beginner-guides/demacia-rising-guide | TB | Act I; có bảng tướng, kẻ thù, thứ tự phân giải lượt |\n| S6 | https://www.riftzone.one/blogs/demacia-rising-league-of-legends | Thấp-TB | Blog thứ cấp; tự nhận mâu thuẫn nhỏ |\n| S7 | https://real4web.com/en/how-to-defeat-the-noxian-invaders-attacking-terbisia-in-demacia-rising/ | Thấp-TB | Hướng dẫn phòng thủ Terbisia |\n| S8 | https://www.followchain.org/defend-dawnhold-against-the-massive-wave-of-noxian-forces-demacia-rising/ | Thấp | Hướng dẫn Dawnhold (có placeholder \"x turns\") |\n| S2 | https://wiki.leagueoflegends.com/en-us/Demacia_Rising | TB | Mới đọc 100k/308k ký tự |\n| — | wiki `Demacia_Rising/Units`, esports.gg patch 26.3 | — | **Không truy cập được** (HTTP 502 / proxy) → chưa có bảng chỉ số đơn vị chính xác |\n\n## 1. Trả lời về hiểu biết của bạn: \"mở rộng lãnh thổ + phòng thủ thành khi Noxus tấn công\"\n**Đúng ở mức cấu trúc, với hiệu chỉnh:**\n- Mở rộng lãnh thổ: ✔ (S1, S3, S6). Chiếm ô bị địch chiếm bằng **trận đã lên lịch** → ô thành \"Open Land\" → lập khu định cư.\n- Phòng thủ: ✔. Có **cảnh báo tập kích** nhắm vào một khu định cư; người chơi điều quân/đóng công trình phòng thủ trước khi bộ đếm hết (S1, S6, S7).\n- **Noxus**: chỉ xuất hiện ở **Act II \"Threats from Beyond\"** (S2). Act I có kẻ thù là quái/sinh vật (Drakehound, Krug, Tribal Warrior, Troll, Yeti, Cloud Drake — S3).\n- **\"Mandi\"**: **không tìm thấy** trong bất kỳ nguồn nào. S3 ghi rõ không nhắc Noxus hay \"Mandi\". → Có thể bạn nhớ nhầm tên; xem câu hỏi bên dưới.\n\n## 2. Thứ tự phân giải cuối lượt (S3 — đã xác minh)\n1. Sản xuất tài nguyên → 2. Xây/nâng cấp (+1 lượt) → 3. Di chuyển quân (+1 lượt) → 4. Huấn luyện quân (+1 lượt) → 5. Sự kiện/mối đe dọa → 6. Trận đã lên lịch.\nDi chuyển ngắn \"vẫn tốn một lượt\" (S6). Chi phí kết thúc lượt: 10 Silver Shields (S1, S3, S6 thống nhất).\n\n## 3. Kinh tế\n- **Food = trần số quân dùng cùng lúc** (không phải tiêu hao mỗi lượt theo nguồn S3); nông trại nâng trần. (S1 viết \"to sustain the army\" – nhất quán.)\n- Lumber/Stone/Metal: xây, nâng cấp, sửa chữa, huấn luyện. Petricite: cấp cao. Valor: nghiên cứu (S3).\n- Lập khu định cư mới (ví dụ Vaskasia): **200 Silver Shields + 100 Lumber**, xây xong 1 lượt (S6 — 1 nguồn).\n- Công trình **phá/sắp xếp lại tự do** (S1, S6). Bonus địa hình ví dụ: nông trại đầu ở Heartland Town cho thêm Food (S1).\n- Chi phí tướng (S3, có thể đã đổi): Poppy 80 Lumber/50 Stone/1 Food/3 lượt; Morgana 70 Stone/150 Metal/1 Food/3 lượt; Kayle 100 Metal/10 Petricite/1 Food/3 lượt; Galio 200 Stone/50 Metal/10 Petricite/1 Food/3 lượt. Barracks Guard: 1 Food + 50 Lumber, 1 lượt (S6).\n- **Tốc độ sản xuất và chi phí công trình: không có nguồn.**\n\n## 4. Quân và chiến đấu\n- Đơn vị cơ bản được nhắc: Soldier, Guard, Archer, Ranger, Militia (phòng thủ cố định), Raptor Aviary (công trình phòng thủ), các tướng.\n- Khắc chế: Guard là cận chiến, ưu tiên mục tiêu tầm xa, bonus damage vs Archer, chịu thêm sát thương từ Ranger (kết quả tìm kiếm, nguồn wiki Units – **chưa đọc trực tiếp**).\n- Kẻ thù Act I có \"gợi ý khắc chế\" (S3): Krug giảm sát thương cận chiến → thêm tầm xa; Tribal Warrior ưu tiên mục tiêu tầm xa → bảo vệ hàng sau; Yeti ném đá AoE → đừng dồn quân; Cloud Drake có đòn diệt quân nhẹ.\n- Trận tự động, có tua nhanh; **xem trước thành phần và sức mạnh tổng** trước khi tấn công (S1, S3).\n- Vị trí quân quyết định khu định cư nào bị đánh (S3) và hậu phương/tiền tuyến (S7). Hồi máu ở khu định cư có Quartermaster trước trận (S7).\n\n## 5. Phòng thủ khi bị tập kích (trọng tâm yêu cầu của bạn)\n- Cảnh báo → chọn: **điều quân tới**, **đóng quân (garrison)** hoặc **công trình phòng thủ** trước khi hết đếm ngược (S6). Thời lượng đếm ngược/độ mạnh/tần suất tập kích: **không nguồn**.\n- Ví dụ Terbisia (S7): 2 Militia nâng Lv2 (\"Lv1 yếu hơn nhiều\"); nghiên cứu chiến đấu Capital Lv1–4, \"Reinforced Borders\" (Lv4) tăng mạnh công trình phòng thủ; viện binh 2 Archer + 2 Guard + 2 Soldier + 1 Ranger; thay thế \"có thể giảm tỉ lệ thành công\". **Militia gắn với khu định cư, không tính vào giới hạn quân cơ động.** Trận bắt đầu sau số lượt phụ thuộc tốc độ quân + vị trí.\n- Ví dụ Dawnhold (S8, chất lượng thấp): phá hết công trình thường, xây 3 Raptor Aviary (Lv2) + 3 Militia (Lv3), đưa Kayle, Galio, Quinn, Poppy, 2 Soldier, 2 Guard; đợi rồi đánh.\n- Điều kiện chương: \"repel 4/4 Threats to the Kingdom\" (S2). Chủ yếu là mục tiêu nhiệm vụ — **không có nguồn về thua trận/mất khu định cư**.\n\n## 6. Nghiên cứu, tiến trình\n- 4 nhánh màu (Green/Blue/Red/Gold) khóa theo cấp thành chính (S1); có chuỗi tuần tự. Mâu thuẫn nhỏ về thứ tự màu (S6) → coi là chưa rõ.\n- Mốc thưởng 12 khu định cư (400 XP mỗi mốc ở 2,4,…,12) (S3) → gợi ý Act I khoảng ≥12 khu định cư; chương quan hệ với số khu định cư (6/14/18 trigger sự kiện — S2).\n\n## 7. Điều chưa biết (tiếp tục KHÔNG suy đoán)\n- Thua trận/mất khu định cư; điều kiện thua tổng; giới hạn lượt.\n- Tần suất/độ mạnh tập kích; thời gian cảnh báo; công thức trận; chỉ số đơn vị.\n- Chi phí/sản lượng công trình; loại khu định cư (ngoài ví dụ Heartland); cấu trúc cây nghiên cứu đầy đủ.\n- \"Mandi\" là gì (không có nguồn).\n- UI/UX thật, nhịp độ — cần video.\n\n## 8. Hệ quả thiết kế cho Dai Viet Rising\n- D1. **Spine của game = vòng lặp \"mở rộng ô → cảnh báo tập kích → chuẩn bị phòng thủ → phân giải tự động\"**; xây dựng chỉ có giá trị khi tác động đến hai việc này (khớp L1).\n- D2. Phòng thủ có 3 đòn bẩy rõ ràng: *quân cơ động*, *quân đồn trú/công trình gắn khu vực* (không tính trần quân cơ động), *nghiên cứu phòng thủ* — dùng được tinh thần này nhưng thiết kế số liệu riêng.\n- D3. Thời gian di chuyển quân vs bộ đếm cảnh báo tạo quyết định thú vị (đến kịp hay không) → ánh xạ sang địa hình sông/núi/đường thủy Đại Việt.\n- D4. Trần quân theo lương thực (Food cap) thay vì tiêu hao đơn giản → đáng cân nhắc, nhưng Việt hóa bằng hậu cần/lúa gạo/đê điều.\n- D5. Phải có **báo cáo nguyên nhân thắng/thua** để tránh cảm giác ngẫu nhiên của auto-battle.\n", "kind": "md"}, {"group": "Nghiên cứu", "path": "docs/research/REFERENCE_DEMACIA_RISING.md", "text": "# Nghiên cứu game tham khảo: Demacia Rising\n\nNgày truy cập: 2026-10-21. Độ tin cậy tổng: **trung bình** (chỉ đọc tài liệu chính thức + wiki + hướng dẫn; **chưa** xem gameplay video, chưa tự chơi — game là metagame trong client LoL, có thể đã kết thúc).\n\n## Nguồn\n| ID | Nguồn | Loại | Tin cậy |\n|---|---|---|---|\n| S1 | https://support.riotgames.com/en-us/league-of-legends/events/league-of-legends-demacia-rising-metagame | Riot chính thức | Cao |\n| S2 | https://wiki.leagueoflegends.com/en-us/Demacia_Rising | Wiki cộng đồng (chỉ đọc 100k/308k ký tự) | Trung bình |\n| S3 | https://www.thespike.gg/league-of-legends/beginner-guides/demacia-rising-guide | Hướng dẫn truyền thông | Trung bình |\n| S4 | backloggd.com/u/Meowpixel/reviews/ | 1 review người chơi | Thấp (ý kiến cá nhân) |\n| S5 | demaciarising.org | Bị đánh giá là nội dung chung chung | Không dùng |\n\n## Sự thật đã xác minh (S1 trừ khi ghi khác)\n- F1. Metagame theo lượt trong client LoL, mở từ màn hình chính; mở rộng lãnh thổ trên bản đồ, xây vương quốc. Hai arc: *The Founding of Demacia* (Act I) và *Threats from Beyond* (Act II). Lịch ghi: Act I 08/01–03/03/2026, Act II 04/03–28/04/2026 (S2 ghi ngày phát hành lệch 1 ngày → dùng \"xấp xỉ\").\n- F2. **Vòng lặp lượt**: mỗi lượt cần 10 Silver Shields (kiếm từ chơi LoL/TFT) để kết thúc. Cuối lượt: công trình sản xuất, xây/huấn luyện tiến triển, quân hành quân, sự kiện/mối đe dọa xuất hiện, trận đã lên lịch bắt đầu.\n- F3. **Tài nguyên**: Food, Lumber, Stone, Metal, Petricite, Silver Shields, Valor (Valor từ lập/nâng cấp khu định cư, thắng trận, sự kiện; cần cho nghiên cứu).\n- F4. **Thị trấn** có bonus theo loại địa hình/vị trí (vd. Heartland: nông trại đầu tiên cho thêm Food; S3 nêu Heartland/Coastal/Mountain). Công trình có thể phá để lấy chỗ.\n- F5. **Nghiên cứu** 4 nhánh màu (Green hệ thống, Blue vương quốc, Red chiến đấu, Gold tướng), khóa theo cấp thành chính (Zeffira); có chuỗi tuần tự.\n- F6. **Chiến đấu tự động (autoplay)**, có nút tăng tốc; kích hoạt khi thăm dò lãnh thổ bị chiếm hoặc bị tập kích; có cảnh báo trước để điều quân phòng thủ. Đơn vị có khắc chế; nghiên cứu tăng sức mạnh. (S1, S3)\n- F7. **Tướng (champions)** mở bằng nghiên cứu, huấn luyện ở Barracks, gia nhập vĩnh viễn theo tiến trình/chương.\n- F8. Có cốt truyện chương (Prologue, Chapter 1–7+), mục tiêu chính góc trên phải, phần thưởng (tài nguyên, XP pass...).\n- F9. Đơn người chơi, cần internet (S2).\n\n## Nhận định người chơi (S4 — 1 ý kiến, chưa kiểm chứng)\n- Vòng lặp \"xây thành → sản xuất → nghiên cứu → chiếm trại → mở thành mới\" hấp dẫn ở phần dựng quân/chinh phục.\n- Phần xây thành yếu: nhiều công trình vô dụng; một số đơn vị lỗi thời; một nâng cấp tướng bị coi là \"bẫy\".\n\n## Chưa biết (KHÔNG suy đoán)\n- Điều kiện thắng/thua, hậu quả thua trận, số lượng/kích thước bản đồ.\n- Chi phí, tốc độ sản xuất, công thức giải quyết trận, chỉ số đơn vị.\n- Chi tiết lựa chọn sự kiện; danh sách đầy đủ công trình/đơn vị.\n- Silver Shields vs \"Silver Shards\" có cùng là một không (S1 dùng cả hai).\n- Cảm giác UI/UX thực tế (cần video/chơi thử).\n\n## Học được (cấp độ nguyên lý) vs không được sao chép\n| Học (nguyên lý) | Không sao chép |\n|---|---|\n| Vòng lặp lượt: hành động tốn thời gian, kết thúc lượt mới phân giải | Tên riêng, nhân vật, địa danh Runeterra, lời thoại, hình ảnh, bản đồ |\n| Mở rộng theo lãnh thổ kề nhau + bonus địa hình | Hệ nhánh nghiên cứu y nguyên (tên/màu/cấu trúc) |\n| Chiến đấu tự động, chiều sâu ở dựng quân/thời điểm/khắc chế | Cổng tiến trình bằng chơi LoL (không áp dụng) |\n| Cảnh báo tập kích → quyết định phòng thủ | Danh sách tướng, lịch mở theo chương |\n| Tướng có vai trò + cốt truyện đan xen | |\n\n## Bài học thiết kế cho Dai Viet Rising\n- L1. Đừng để công trình \"chỉ là tăng tài nguyên\" → mỗi công trình phải thay đổi quyết định chiến lược (hậu cần, phòng tuyến, thủy lộ).\n- L2. Tự động giải quyết trận chỉ ổn nếu **tiền chiến** (địa hình, hậu cần, bố trí) có chiều sâu và hiển thị rõ lý do thắng/thua.\n- L3. Cần thay cơ chế \"Silver Shields từ game khác\" bằng nhịp lượt riêng (không cần tài khoản/online).\n", "kind": "md"}, {"group": "Nghiên cứu", "path": "docs/00_INTAKE.md", "text": "# 00 — INTAKE & VALIDATION (Phase 0)\n\nNgày: 2026-10-21 · Nguồn: `game.yaml` (đọc nguyên văn), `.game-studio/WORKFLOW.md`, `.game-studio/prompts/ORCHESTRATOR.md`, `state/`.\n\n## 1. Tóm tắt brief\n- Game: **Dai Viet Rising** — chiến lược/xây dựng quốc gia bối cảnh Đại Việt, lấy cảm hứng *nguyên lý gameplay* từ Demacia Rising.\n- Nền tảng: web (GitHub Pages), offline single-player, chuột + cảm ứng, tiếng Việt. Tương lai: Android/iOS/desktop (chưa làm).\n- Ràng buộc: ngân sách tối thiểu, không dịch vụ trả phí, 1 dev + Claude Code, không backend trong MVP. Engine chọn sau G2.\n- Narrative: `central`. Phải phân biệt sự kiện có nguồn / hư cấu / lịch sử giả định.\n\n## 2. Kiểm tra\n| Mục | Kết quả |\n|---|---|\n| Slug | `daiviet-rising` (khớp thư mục) |\n| Link tham chiếu | `references[0].url` **để trống** → xem Câu hỏi Q1 |\n| Xác minh game tham khảo | Đã làm: xem `docs/research/REFERENCE_DEMACIA_RISING.md` (độ tin cậy trung bình) |\n| Multiplayer/online | Không (offline) |\n| Monetization | Không áp dụng |\n| Code repo riêng | Chưa có; `project.code_repo` không khai báo. Thư mục này chưa phải git repo. |\n\n## 3. Giả định (cần bạn xác nhận hoặc sửa)\n- A1. \"Demacia Rising\" = metagame chiến lược theo lượt trong client League of Legends (Riot Games, mùa 2026 Season 1 \"For Demacia\"). Không phải game nào khác trùng tên.\n- A2. \"Học hỏi gameplay\" = tham khảo cấu trúc vòng lặp (lượt, mở rộng lãnh thổ, nghiên cứu, tự động giải quyết trận), **không** sao chép nội dung/IP.\n- A3. Các cơ chế chưa được nguồn xác nhận (chi phí, công thức, điều kiện thắng/thua) sẽ **không** bị suy đoán; thiết kế riêng cho Đại Việt.\n- A4. Ngôn ngữ tài liệu: tiếng Việt.\n\n## 4. Câu hỏi (không chặn G1, nhưng nên trả lời khi duyệt)\n- Q1. Đúng là Demacia Rising của LoL (A1)? Nếu có link/video bạn muốn dùng làm chuẩn, hãy gửi.\n- Q2. Thời kỳ ưu tiên cho MVP: Lý–Tống (1075–77), Trần–Nguyên (1258–1288), hay Nam tiến (thế kỷ XV)? (Mỗi concept dưới đây gợi ý một lựa chọn.)\n- Q3. Mức độ chấp nhận chủ đề nhạy cảm (chiến tranh với Champa 1471 có bạo lực với dân thường theo sử liệu).\n\n## 5. Trạng thái\nPhase 0 hoàn tất. Chuyển Phase 1 → `docs/research/`, `docs/concepts/`.\n", "kind": "md"}, {"group": "Concept (G1)", "path": "docs/concepts/CONCEPT_A_HO_QUOC_TUYEN.md", "text": "# CONCEPT A — Hộ Quốc Tuyến (Phòng tuyến giữ nước)\n\n**Thể loại:** chiến lược theo lượt + xây dựng quốc gia + phòng thủ. Gần nhất với vòng lặp Demacia Rising (F2, F4, F6).\n**Thời kỳ MVP:** Lý–Tống 1075–1077 (chiến dịch 1), mở rộng Trần–Nguyên (chiến dịch 2). Nhãn: `[SOURCED]` cho khung sự kiện, `[FICTION]` cho nhân vật phụ/sự kiện địa phương.\n\n## Fantasy\nLà triều đình điều hành vùng châu Bắc Đại Việt: dựng kinh tế, quân, thành lũy; đọc tin tình báo; quyết định **đánh trước hay giữ tuyến** trước đại quân phương Bắc.\n\n## Core loop (mỗi lượt ≈ 1 tuần/tháng trong game)\n1. Xem bản đồ + cảnh báo tình báo → 2. Giao việc: xây/nâng (đồn, kho, đê, bến), tuyển/luyện quân, nghiên cứu \"kế sách\" → 3. Điều quân, đặt phòng tuyến → 4. **Kết thúc lượt** → sản xuất, hậu cần, sự kiện, giao tranh tự động có báo cáo nguyên nhân thắng/thua.\n**Meta loop:** hoàn thành giai đoạn chiến dịch → mở kế sách, tướng (nhân vật có nguồn), chiến dịch mới.\n\n## Hệ thống chính\n- Bản đồ ô/châu kề nhau, địa hình (đồng bằng, sông, núi, ven biển) cho bonus/phạt.\n- Tài nguyên: lương, gỗ/tre, đá, sắt, **lòng dân/uy tín**; hậu cần là ràng buộc cứng (quân hết lương thì suy giảm).\n- Phòng tuyến sông: cọc ngầm, đồn tre (khung từ H2) — đặt trước, quyết định kết quả giao tranh.\n- Chiến đấu auto-resolve theo khắc chế + địa hình + hậu cần + tinh thần; báo cáo minh bạch (L2).\n- Ngoại giao: giảng hòa/chiến tranh tâm lý như đòn kết thúc.\n- Tướng: vài nhân vật lịch sử có nguồn, vai trò rõ.\n\n## Phạm vi MVP (ước lượng, chưa cam kết)\n1 chiến dịch (≈8–10 chương lượt), ~12–15 loại công trình, ~6 loại quân, 1 bản đồ ≈ 25–35 ô, 6–10 sự kiện. Lưu cục bộ (localStorage/file xuất).\n\n## Điểm mạnh / Rủi ro\n+ Dễ dựng trên web, 2D/UI-heavy, hợp 1 dev; gần reference, đã có bài học (L1–L3).\n− Dễ thành bản sao cơ chế nếu thiếu bản sắc → giảm bằng phòng tuyến sông/hậu cần/đê điều.\n− Cân bằng auto-battle cần nhiều test; sử liệu số liệu chưa chắc → dùng tỉ lệ trừu tượng, không số lịch sử.\n− Rủi ro \"xây thành vô nghĩa\" (L1).\n\n**Hợp nền tảng web/chạm:** Cao (UI dạng bảng + bản đồ ô, không cần realtime).\n", "kind": "md"}, {"group": "Concept (G1)", "path": "docs/concepts/CONCEPT_B_NAM_TIEN_KHAI_PHA.md", "text": "# CONCEPT B — Mở Cõi Phương Nam (chiến lược dài hạn: định cư, ngoại giao, ảnh hưởng)\n\n**Thể loại:** 4X-lite / chiến lược khu vực theo lượt, xoay quanh **ảnh hưởng** thay vì chỉ quân sự.\n**Thời kỳ MVP:** thế kỷ XV (quanh 1471) hoặc kịch bản **giả định** (`[ALT-HISTORY]`) về ngoại giao biên giới. Phải gắn nhãn rõ.\n\n## Fantasy\nLà triều đình/quan trấn biên: quyết định đưa dân khai khẩn, lập đồn điền, kết giao hay đối đầu Champa/Khmer, cân bằng áp lực phương Bắc với mở rộng phương Nam.\n\n## Core loop\nChọn mục tiêu khu vực → phân bổ dân, lương, quân, sứ đoàn → kết thúc lượt → ảnh hưởng/dân số/ổn định thay đổi, sự kiện ngoại giao → mở cơ hội mới.\n**Meta:** các \"thập kỷ\" mở khóa chính sách, tập tục, kỹ thuật.\n\n## Hệ thống\n- Chỉ số khu vực: dân cư, nông nghiệp, ổn định, ảnh hưởng, quan hệ với từng thế lực (Champa, Khmer, phương Bắc).\n- Ngoại giao: cống sứ, hôn nhân, liên minh, thỏa thuận biên giới — chiến tranh chỉ là một lựa chọn.\n- Chiến dịch quân sự dạng sự kiện quyết định (ít điều khiển trực tiếp).\n- Narrative nặng: nhân vật nhiều phía có chiều sâu (không đồng nhất hóa người hiện đại với đối thủ lịch sử).\n\n## Phạm vi MVP\n1 kịch bản, ~20 khu vực, 3 thế lực, ~30 sự kiện/ quyết định có nhãn nguồn. Ít công trình hơn A.\n\n## Điểm mạnh / Rủi ro\n+ Bản sắc mạnh, khác biệt với reference; ngoại giao/hậu cần nổi bật.\n− **Nhạy cảm cao** về lịch sử (bạo lực dân sự trong nguồn H6; con số không thống nhất) → cần cố vấn sử học và cách diễn đạt cẩn trọng.\n− Cân bằng hệ thống xã hội khó hơn A; xa nhất khỏi core loop đã được xác minh trong reference.\n− Khối lượng nội dung/narrative lớn cho 1 dev.\n\n**Hợp web/chạm:** Cao (UI thông tin), nhưng khối lượng nội dung lớn.\n", "kind": "md"}, {"group": "Concept (G1)", "path": "docs/concepts/CONCEPT_C_THE_TRAN_SONG_NUOC.md", "text": "# CONCEPT C — Thế Trận Sông Nước (chiến dịch tình huống: thủy chiến, địa hình, hậu cần)\n\n**Thể loại:** chiến thuật/giải đố hoạch định theo kịch bản (scenario-based), phiên ngắn 15–30 phút.\n**Thời kỳ MVP:** Bạch Đằng — 938 (Ngô Quyền) / 1288 (Trần) làm cặp so sánh; `[SOURCED]` khung, chi tiết bố trí `[FICTION]`/suy đoán phải gắn nhãn (tactics H4, H5).\n\n## Fantasy\nLà chỉ huy lập kế hoạch: đọc thủy triều, bố trí cọc ngầm, nhử thuyền địch, cắt hậu cần — rồi xem trận diễn ra.\n\n## Core loop\nPha chuẩn bị (ngân sách, nhân lực, địa điểm bẫy, nhử, thời điểm theo thủy triều) → pha phân giải (mô phỏng nhiều bước có thể tua/xem lại) → báo cáo hiệu quả → chấm điểm + mở scenario kế tiếp.\n**Meta:** chuỗi scenario theo thời kỳ (938 → 981 → 1077 → 1288...), mở công cụ/binh pháp.\n\n## Hệ thống\n- Bản đồ cục bộ lưới/đồ thị sông; thủy triều, gió, độ sâu.\n- Đơn vị thuyền/bộ binh/cung nỏ + khắc chế; hậu cần và tinh thần.\n- Công cụ: cọc ngầm, xích, phục binh, tung tin giả.\n- Mô phỏng xác định (deterministic + seed) để replay/testing dễ.\n\n## Phạm vi MVP\n3–4 scenario, ~8 loại đơn vị/công cụ, 1 hệ mô phỏng. Không có xây dựng quốc gia dài hạn.\n\n## Điểm mạnh / Rủi ro\n+ Phạm vi nhỏ nhất, test/QA tự động dễ nhất; bản sắc Việt rõ (sông nước); ít rủi ro sử liệu nhạy cảm.\n− **Xa nhất khỏi fantasy \"xây dựng quốc gia\" và reference** trong brief (thiếu city/economy loop); có thể bị coi là không đúng tinh thần brief.\n− Thiết kế puzzle cần cân bằng để khỏi \"một lời giải duy nhất\".\n− Giá trị chơi lại thấp nếu ít scenario.\n\n**Hợp web/chạm:** Rất cao.\n", "kind": "md"}, {"group": "Concept (G1)", "path": "docs/concepts/PROPOSAL.md", "text": "# PROPOSAL — 3 concept cho G1\n\nNgày: 2026-10-21 · Tham chiếu: `docs/research/REFERENCE_DEMACIA_RISING.md`, `docs/research/HISTORY_SETTING.md`.\n\n## So sánh\n| Tiêu chí | A. Hộ Quốc Tuyến | B. Mở Cõi Phương Nam | C. Thế Trận Sông Nước |\n|---|---|---|---|\n| Thể loại | Chiến lược lượt + xây dựng + phòng thủ | 4X-lite, ngoại giao/ảnh hưởng | Chiến thuật hoạch định theo kịch bản |\n| Khớp fantasy trong brief (xây dựng + bảo vệ + phát triển phương Nam) | Xây dựng ✔ Bảo vệ ✔ Phương Nam ✖ (chiến dịch sau) | Xây dựng ◐ Bảo vệ ◐ Phương Nam ✔ | Xây dựng ✖ Bảo vệ ✔ Phương Nam ✖ |\n| Gần core loop đã xác minh của reference | Cao | Thấp | Thấp-Trung bình |\n| Bản sắc Việt | Trung bình-Cao (phòng tuyến sông, hậu cần, đê) | Cao (ngoại giao khu vực) | Cao (thủy chiến) |\n| Khối lượng nội dung MVP | Trung bình | Cao | Thấp |\n| Khả thi 1 dev, web | Cao | Trung bình | Rất cao |\n| Test tự động | Trung bình | Khó | Dễ |\n| Rủi ro lịch sử/nhạy cảm | Trung bình | **Cao** | Thấp |\n| Giá trị chơi lại | Trung bình (nhiều chiến dịch) | Cao (nhiều lựa chọn) | Thấp-TB |\n\n## Khuyến nghị (không chọn thay bạn)\n**Concept A** là lựa chọn cân bằng nhất: khớp nhiều nhất với brief và với vòng lặp đã được xác minh của reference, khả thi cho 1 dev. Có thể thêm **phương Nam (từ B)** như chiến dịch hậu MVP, và dùng **pha chuẩn bị theo địa hình/thủy triều (từ C)** làm cơ chế phòng tuyến trong A. Nếu ưu tiên phạm vi nhỏ nhất và test dễ nhất, chọn C; nếu ưu tiên bản sắc/ngoại giao, chọn B nhưng cần cố vấn sử học.\n\n## Rủi ro chung & điều chưa biết\n- Reference mới xác minh qua tài liệu, **chưa xem video gameplay** → UI/UX/độ khó thực tế chưa biết. Có thể nâng độ tin cậy nếu bạn gửi link.\n- Số liệu lịch sử chưa đối chiếu sử liệu gốc → game dùng tham số trừu tượng, không số lịch sử cho đến Phase 2.\n- Pacing thay cho \"Silver Shields\" chưa thiết kế (cần quyết ở Phase 2).\n- Engine/framework chưa chọn (theo workflow: sau G2).\n\n## Quyết định cần từ bạn tại G1\nTrả lời bằng một câu, ví dụ:\n`approve G1: chọn Concept A, MVP chiến dịch Lý–Tống, ghi chú: ...`\n(Có thể chọn A/B/C, hoặc kết hợp có nêu rõ, hoặc yêu cầu sửa/đề xuất lại. Có thể kèm trả lời Q1–Q3 trong `docs/00_INTAKE.md`.)\n\n**Chưa có phê duyệt. Dừng tại G1.**\n", "kind": "md"}, {"group": "Thiết kế (G2)", "path": "docs/design/01_VISION_PILLARS.md", "text": "# 01 — Vision, Pillars, Cách gộp 3 concept (DSN-VIS)\n\nTrạng thái: **candidate cho G2** · Phiên bản: 0.1 · Dựa trên G1 (xem `state/APPROVALS.md`) và `docs/research/REFERENCE_DEEP_DIVE.md`.\n\n## Tầm nhìn\nChiến lược theo lượt trên web: mở rộng lãnh thổ Đại Việt ô-kề-ô và **giữ các thành/trấn trước các đợt tập kích** bằng quân, công trình, địa hình, hậu cần và kế sách — lấy bối cảnh các giai đoạn có sử liệu.\n\n## Cách gộp A + B + C (đề xuất — cần duyệt ở G2)\n| Lớp | Nguồn concept | Vai trò | Phát hành |\n|---|---|---|---|\n| Spine | A Hộ Quốc Tuyến | Vòng lặp lượt: mở rộng → cảnh báo → phòng thủ → phân giải | MVP |\n| Lớp chuẩn bị chiến trường | C Thế Trận Sông Nước | Địa hình/thủy triều/cọc ngầm/nhử trong pha chuẩn bị; trận thủy | MVP (phần giản lược) + CP2 |\n| Lớp khu vực/ngoại giao | B Mở Cõi Phương Nam | Chiến dịch phương Nam, ảnh hưởng/ngoại giao | Sau MVP (CP3), cần rà soát sử học |\n\n**Nguyên tắc ranh giới:** MVP = *Chiến dịch 1* (Lý–Tống 1075–77). CP2 Trần–Nguyên, CP3 Nam tiến là bản mở rộng, mỗi bản qua change request.\n\n## Trụ cột thiết kế\n- **PIL-01 Mọi công trình đều đổi quyết định.** Công trình phải tác động tới mở rộng hoặc phòng thủ (bài học L1).\n- **PIL-02 Đến kịp hay không.** Thời gian di chuyển (địa hình) so với bộ đếm cảnh báo là quyết định chính.\n- **PIL-03 Trận tự động nhưng giải thích được.** Luôn có báo cáo nguyên nhân thắng/thua (D5).\n- **PIL-04 Bản sắc Đại Việt.** Sông nước, đê, hậu cần, thành lũy tre/đất, ngoại giao — không mang cơ chế fantasy.\n- **PIL-05 Sử liệu minh bạch.** Mỗi nội dung gắn nhãn `SOURCED / FICTION / ALT-HISTORY`; không dùng số liệu lịch sử chưa đối chiếu.\n- **PIL-06 Nhỏ, offline, chạm được.** Chạy tĩnh trên GitHub Pages, chuột + chạm, tiếng Việt.\n\n## Không làm (non-goals MVP)\nBackend/online, monetization, chiến đấu điều khiển trực tiếp, mobile app gốc, nhiều ngôn ngữ, sao chép tên/nhánh nghiên cứu/tướng từ reference.\n\n## Điểm khác biệt có chủ đích so với reference\n| Reference | Dai Viet Rising |\n|---|---|\n| Cổng tiến trình bằng chơi LoL (10 Silver Shields/lượt) | Không có phí kết thúc lượt; áp lực bằng **lịch chiến dịch** (deadline sự kiện) |\n| Chiến đấu auto, thông tin ít | Auto + **báo cáo nguyên nhân** + tình báo có độ nhiễu |\n| Địa hình chỉ bonus công trình | Địa hình ảnh hưởng **tốc độ hành quân, phòng tuyến, trận** |\n| Thắng/thua tổng chưa rõ | Thua/thắng chiến dịch **do chúng ta định nghĩa** (xem GDD SYS-12) |\n", "kind": "md"}, {"group": "Thiết kế (G2)", "path": "docs/design/02_GDD.md", "text": "# 02 — GDD (hệ thống, công thức, trường hợp biên)\n\nPhiên bản 0.1 (candidate). **Mọi con số là `PLACEHOLDER-BALANCE`** — chỉ để làm khung, sẽ cân bằng bằng simulation ở Phase 4 (không dùng số liệu lịch sử). ID: `SYS-xx`.\n\n## SYS-01 Bản đồ & ô\n- Bản đồ = đồ thị các **ô** (châu/lộ trừu tượng). Mỗi ô: `terrain ∈ {dong_bang, song, nui, ven_bien, rung}`, danh sách kề kèm `move_cost`, số `slot` công trình, `state ∈ {hostile, open, settled, contested, lost}`, `owner`.\n- `hostile`: bị địch chiếm → cần trận để chiếm (`SYS-06`). `open`: đất trống, lập khu định cư tốn tài nguyên. `settled`: có khu định cư (cấp 1–5).\n- MVP Chiến dịch 1: ~28 ô (placeholder).\n\n## SYS-02 Lượt & thứ tự phân giải\nNgười chơi ra lệnh → **Kết thúc lượt** (miễn phí). Thứ tự (theo reference S3, áp dụng nguyên lý):\n1. Sản xuất → 2. Công trình (hoàn tất nếu `remaining==0`) → 3. Di chuyển quân → 4. Huấn luyện → 5. Sự kiện & tình báo → 6. Trận đã lên lịch.\nMỗi lệnh có `duration` (số lượt). Di chuyển ngắn vẫn ≥1 lượt. Xác định (deterministic) theo `seed` của chiến dịch.\n\n## SYS-03 Tài nguyên\n| Tài nguyên | Nguồn | Dùng |\n|---|---|---|\n| Lương (grain) | Ruộng/đồn điền | **Trần quân cơ động** (supply cap) + nuôi quân đồn trú |\n| Gỗ-tre | Trại gỗ | Xây, đồn tre, cọc, thuyền |\n| Đá | Mỏ đá | Thành, kè, đê |\n| Sắt | Lò rèn | Vũ khí, nâng cấp |\n| Dân tâm | Lập khu định cư, thắng trận, sự kiện | Nghiên cứu **Kế sách** (tương đương vai trò Valor ở mức nguyên lý) |\n\nCông thức:\n- `output(b,t) = base[b.level] × terrain_mult(b.type, t.terrain) × (1 + 0.1·adjacent_synergy)`\n- `supply_cap = 4 + Σ granary_level` (placeholder). Quân cơ động vượt cap → mỗi lượt `-5% morale` mỗi đơn vị vượt.\n- Quân đồn trú & công trình phòng thủ **không tính** vào `supply_cap` nhưng tốn lương duy trì nhỏ.\n\n## SYS-04 Công trình (mỗi cái phải thỏa PIL-01)\n| ID | Công trình | Tác động quyết định |\n|---|---|---|\n| BLD-FARM | Ruộng/đồn điền | Lương + nâng supply_cap |\n| BLD-LUMBER | Trại gỗ-tre | Gỗ-tre |\n| BLD-QUARRY | Mỏ đá | Đá |\n| BLD-FORGE | Lò rèn | Sắt, mở quân cấp cao |\n| BLD-BARRACKS | Trại quân | Huấn luyện quân/tướng |\n| BLD-GRANARY | Kho lương | +supply_cap, giảm phạt hậu cần khi hành quân xa |\n| BLD-DIKE | Đê/kè | Giảm sát thương lũ; trong ô `song` tạo **tuyến chặn** |\n| BLD-PALISADE | Đồn tre/lũy | Phòng thủ gắn ô (không tính trần quân); cấp 1–3 |\n| BLD-STAKES | Cọc ngầm (chỉ ô `song`) | Đánh quân thủy/vượt sông (lớp C) |\n| BLD-WATCH | Chòi canh | Tăng độ chính xác tình báo & thời gian cảnh báo |\n| BLD-DOCK | Bến thuyền | Mở quân thủy; tốc độ đường sông |\nCông trình có thể **phá/sắp xếp lại** (hoàn lại 50%, placeholder).\n\n## SYS-05 Quân\nLớp: `bo_binh` (cận chiến), `cung_no` (tầm xa), `ky_tuong`/`tuong` (anh hùng có nguồn), `thuy_binh`, `dan_binh` (đồn trú). Khắc chế (ma trận placeholder): cận chiến > tầm xa; tầm xa > thủy khi bị cọc; AoE phạt dồn quân. Mỗi đơn vị: `hp, atk, def, range, speed, cost, train_turns, supply`.\n- **Tướng** (`CHR-*`): chỉ nhân vật có nguồn; vai trò kỹ năng trừu tượng, không sao chép tướng của reference.\n\n## SYS-06 Trận tự động\nMô phỏng `N=12` vòng. Mỗi vòng, mỗi đơn vị chọn mục tiêu theo ưu tiên lớp; sát thương:\n`dmg = atk × counter(attacker,target) × terrain_atk_mod × morale_mod × (1 − def_reduction) × rand(0.9..1.1 theo seed)`\n`def_reduction = min(0.6, def/(def+K))` + `fort_bonus` nếu bên phòng thủ ở ô có `BLD-PALISADE`.\nKết thúc khi một bên hết quân hoặc hết vòng (so điểm còn lại). **Báo cáo nguyên nhân** (PIL-03): top 3 yếu tố (khắc chế, địa hình, hậu cần/morale, công trình) + đơn vị gây/ chịu nhiều sát thương nhất.\n- Xem trước thành phần địch: mức chính xác phụ thuộc `BLD-WATCH` và tình báo (`SYS-08`).\n\n## SYS-07 Tập kích & phòng thủ (trọng tâm)\n- **Cảnh báo:** đợt tập kích sinh ra với `target_tile`, `eta = ceil(path_cost / enemy_speed)`; cảnh báo hiện khi `eta ≤ warn_lead` (`warn_lead = 2 + watch_bonus`).\n- **Ba đòn bẩy:** (1) điều quân cơ động tới kịp trước `eta`; (2) đồn trú + công trình gắn ô; (3) Kế sách phòng thủ (ví dụ \"Lũy biên\").\n- **Đường tới:** quân đi theo đường rẻ nhất; chặn đường/đoạn sông bằng tuyến chặn có thể làm địch chậm.\n- Trận xảy ra khi `eta` về 0.\n\n## SYS-08 Tình báo\nMức: `chính_xác`, `ước_lượng (±25%)`, `mơ_hồ (lớp quân, không số)`. Chòi canh/trinh sát nâng mức. Thông tin sai có thể là sự kiện `FICTION`.\n\n## SYS-09 Kế sách (nghiên cứu)\nCây 4 nhánh *riêng của dự án* (chưa đặt tên cuối, không dùng nhánh màu/cấu trúc reference): Nông-hậu cần, Thành-phòng, Quân-chiến thuật, Ngoại giao. Tốn Dân tâm; khóa theo cấp **Kinh đô/Thủ phủ**.\n\n## SYS-10 Sự kiện & ngoại giao\nSự kiện có lựa chọn, nhãn nguồn. Ngoại giao (Chiến dịch 1): đàm phán kết thúc khi điều kiện đạt (xem §9).\n\n## SYS-11 Lớp thủy chiến (từ C)\nÔ `song`: thủy triều chu kỳ 2–3 lượt (placeholder); `BLD-STAKES` hiệu quả khi nước rút/lên theo kịch bản; nhử mục tiêu = lệnh kéo địch vào ô cọc. Dùng chủ yếu ở CP2, MVP có phiên bản giản lược (tuyến sông CP1).\n\n## SYS-12 Thắng / Thua (thiết kế của chúng ta — reference chưa rõ)\n- **Thua:** mất Thủ phủ (`CAPITAL`), hoặc tổng `Dân tâm < 0` kéo dài 3 lượt.\n- **Thắng CP1:** chặn đợt tập kích cuối **và** đạt điều kiện giảng hòa/ngoại giao đến hạn lịch.\n- **Hậu quả thua một ô khác:** ô thành `lost` (công trình giảm cấp, quân đồn trú mất); có thể chiếm lại bằng trận (`SYS-06`).\n\n## Trường hợp biên (EDGE)\n- EDGE-01: Hai đợt tập kích cùng ETA cùng ô → gộp thành 1 trận hai làn (placeholder: xử lý tuần tự theo ID).\n- EDGE-02: Quân đang di chuyển bị tập kích đường → dừng tại ô gần nhất, trận tại đó.\n- EDGE-03: Phá công trình khi đang có trận lên lịch ở ô đó → cho phép, mất bonus ngay.\n- EDGE-04: Supply cap giảm (phá kho) khi đã vượt → áp dụng phạt từ lượt sau.\n- EDGE-05: Không đủ tài nguyên khi hàng đợi tới lượt → lệnh tạm dừng, không mất tài nguyên đã trả.\n- EDGE-06: Lưu/nạp giữa lượt: chỉ lưu tại trạng thái \"đang ra lệnh\" (đầu pha người chơi).\n- EDGE-07: Cùng seed + cùng lệnh → kết quả giống hệt (test bắt buộc).\n\n## Phụ lục Phase 4 (CR-001) — thay đổi sau G2, xem `docs/change_requests/CR-001_balance_fixes_from_TST08.md`\n- SYS-05: **trần đồn trú theo ô** = 4 (+4 thủ phủ) + 3 × tổng cấp công trình có `fort_bonus`.\n- SYS-12 (thắng): `negotiate` hợp lệ khi lượt ≥ 21, không còn đợt tập kích, đã chặn ≥ 4 đợt, Dân tâm ≥ 10, và đang giữ ≥ 3 khu định cư. Thua: thủ phủ thất thủ / Dân tâm < 0 liên tục 3 lượt / quá lượt 28.\n- SYS-03: công sự tối đa 40% giảm sát thương; không có chi phí duy trì lương.\n- Dân tâm: +3 lập khu định cư, +2 chiếm ô địch, +3 chặn tập kích, −5 mất ô.\n", "kind": "md"}, {"group": "Thiết kế (G2)", "path": "docs/design/03_CONTENT_NARRATIVE.md", "text": "# 03 — Nội dung, lịch sử & tường thuật (CNT-xx)\n\nNhãn bắt buộc cho mọi nội dung: `[SOURCED]` có nguồn · `[FICTION]` hư cấu · `[ALT-HISTORY]` giả định. Nguồn hiện có: `docs/research/HISTORY_SETTING.md` (độ tin cậy TB-thấp, **cần rà soát sử học trước khi phát hành**).\n\n## Chiến dịch (CMP)\n| ID | Chiến dịch | Thời kỳ | Spine | Lớp | Phát hành |\n|---|---|---|---|---|---|\n| CMP-01 | Hộ Quốc Tuyến | Lý–Tống 1075–1077 | A | C giản lược (tuyến sông) | **MVP** |\n| CMP-02 | Sông Nước Bạch Đằng | Trần–Nguyên 1285–1288 | A | C đầy đủ (thủy triều/cọc/nhử) | Sau MVP |\n| CMP-03 | Mở Cõi Phương Nam | Thế kỷ XV (hoặc giả định) | A | B ngoại giao/ảnh hưởng | Sau MVP, cần cố vấn sử học |\n\n## CMP-01 khung sự kiện (`SOURCED` ở mức khung, chi tiết `FICTION`)\n1. Mở đầu: tình báo về việc Tống chuẩn bị (khung H8 \"tiên phát chế nhân\").\n2. Hành động tùy chọn: **tập kích trước ở biên** (người chơi chọn; hệ quả là cơ chế game, không khẳng định chi tiết lịch sử).\n3. Các đợt tập kích tăng dần về biên/Bắc; tuyến sông (CP1 đặt chủ đề sông Như Nguyệt, ≈ đầu 1077 theo H2).\n4. Kết: giảng hòa — điều kiện ngoại giao (SYS-10).\n- Nhân vật có nguồn: Lý Thường Kiệt (chỉ huy). Nhân vật khác `FICTION` ghi rõ.\n- Văn bản: *Nam quốc sơn hà* — chỉ trích dẫn dạng ghi nguồn nếu dùng; kiểm tra bản quyền/bản dịch.\n\n## Nguyên tắc tường thuật\n- CNT-P1: Quân đối phương là **thực thể lịch sử có chiều sâu**, không đồng nhất với quốc gia/dân tộc hiện đại; tránh ngôn ngữ miệt thị.\n- CNT-P2: Không gộp các cuộc chiến cách nhau nhiều thế kỷ mà không giải thích; mỗi chiến dịch có màn \"bối cảnh & nguồn\".\n- CNT-P3: Số liệu quân/thương vong **không hiển thị như sự thật lịch sử**; chỉ cơ chế trừu tượng.\n- CNT-P4: Nội dung bạo lực với dân thường (nhất là CMP-03) xử lý bằng cách diễn đạt có trách nhiệm, qua rà soát sử học/cộng đồng.\n\n## Cấu trúc dữ liệu\nNội dung đặt trong `game-data/` (YAML/JSON), ID ổn định: `CMP-`, `TIL-`, `BLD-`, `UNT-`, `CHR-`, `EVT-`, `POL-` (kế sách). Mỗi bản ghi có `source_label` và `source_ids`.\n\n## Danh mục nội dung MVP (mục tiêu)\n~28 ô, ~11 công trình, ~6 loại quân, ~3 tướng/chỉ huy có nguồn, ~8 sự kiện, ~12 kế sách (placeholder; chốt khi cân bằng).\n", "kind": "md"}, {"group": "Thiết kế (G2)", "path": "docs/design/04_UX_ART_ACCESSIBILITY.md", "text": "# 04 — UX, Art/Audio, Accessibility, Save/Load (UXD-xx)\n\n## Màn hình & luồng (UXD-FLOW)\nMenu → Chọn chiến dịch (có màn Bối cảnh & Nguồn) → **Bản đồ** (màn chính) → [Chi tiết ô / Xây / Huấn luyện / Điều quân / Kế sách] → Kết thúc lượt → **Bản tin cuối lượt** (sản xuất, sự kiện, cảnh báo) → Trận (tự động, tua nhanh, báo cáo nguyên nhân) → Kết chiến dịch.\n- UXD-01 Bản đồ ô SVG, chạm/chuột, zoom/pan.\n- UXD-02 Dải cảnh báo luôn hiển thị: ô bị nhắm, ETA, mức tình báo.\n- UXD-03 Điều quân: chọn quân → chọn ô → hiển thị **thời gian tới** so với ETA đợt tập kích (PIL-02).\n- UXD-04 Xem trước trận: thành phần + độ tin cậy tình báo; không hứa kết quả.\n- UXD-05 Báo cáo trận: 3 yếu tố chính + nhật ký vòng (tua nhanh/bỏ qua).\n- UXD-06 Hoàn tác trong lượt (trước Kết thúc lượt).\n\n## Art / Audio (định hướng)\nPhong cách 2D tối giản lấy cảm hứng tranh dân gian/bản đồ cổ (nguồn mở hoặc tự vẽ SVG); **không dùng tài sản có bản quyền hoặc của reference**. Nhạc/SFX: giấy phép miễn phí/CC0, ghi nguồn trong `docs/production/ASSET_LICENSES.md` (sẽ tạo ở Phase 4). Lời thoại: chữ, MVP không lồng tiếng.\n\n## Accessibility (UXD-A11Y)\n- Điều khiển chuột + chạm, đủ vùng chạm ≥44px; hỗ trợ bàn phím cơ bản cho menu/hành động.\n- Không chỉ dựa vào màu (icon/texture); tương phản WCAG AA; cỡ chữ chỉnh được; giảm chuyển động.\n- Nội dung tiếng Việt (UTF-8), font hỗ trợ dấu.\n\n## Save/Load (UXD-SAVE)\n- Lưu tự động đầu mỗi lượt vào `localStorage`; xuất/nhập file JSON. Schema có `save_version`; migration có test. Cùng seed + lệnh → tái hiện (EDGE-07).\n- Không dữ liệu cá nhân, không mạng.\n", "kind": "md"}, {"group": "Thiết kế (G2)", "path": "docs/design/05_TECH_ARCHITECTURE_TEST.md", "text": "# 05 — Kiến trúc kỹ thuật, dữ liệu, chiến lược kiểm thử (TDD-xx, TST-xx)\n\nĐề xuất — **chốt khi duyệt G2** (workflow: chọn stack sau khi duyệt thiết kế).\n\n## Lựa chọn đề xuất (TDD-01)\n- Ngôn ngữ: **TypeScript**; bundler **Vite**; UI: DOM + **SVG** cho bản đồ (không cần engine game); không framework nặng (có thể dùng thư viện nhỏ nếu cần). Miễn phí/mã nguồn mở.\n- Lý do: web tĩnh, offline, chạm; logic thuần dễ test; không cần engine 2D realtime. **Phương án khác** (cần bạn cân nhắc): Phaser/Godot web — mạnh hơn cho hoạt ảnh trận nhưng nặng hơn cho game UI-heavy.\n- Triển khai: GitHub Pages (`base` path đúng, không secret). **Không deploy** khi chưa có G3.\n\n## Phân tầng (TDD-02)\n```\nsrc/sim/      lõi thuần, deterministic (không DOM, không Date.now/Math.random → seeded RNG)\nsrc/data/     loader + validator schema (đọc game-data/)\nsrc/ui/       SVG map, panels, báo cáo trận\nsrc/save/     serialize/migrate\ngame-data/    YAML/JSON nội dung (nguồn sự thật), build sang JSON\ntests/        unit (sim), integration (turn), e2e (Playwright)\n```\n`sim` nhận `(state, commands, seed) → (state', events, reports)`; UI chỉ hiển thị và gửi lệnh.\n\n## Schema dữ liệu (TDD-03)\nTệp mẫu ở `game-data/`: `tiles`, `buildings`, `units`, `campaign`. Trường chung: `id`, `name_vi`, `source_label`, `source_ids`, `balance: placeholder|tuned`. Validator kiểm: ID duy nhất, tham chiếu hợp lệ, nhãn nguồn hợp lệ, đồ thị kề đối xứng.\n\n## Chiến lược kiểm thử (TST)\n| ID | Loại | Nội dung |\n|---|---|---|\n| TST-01 | Unit | Công thức sản xuất, supply_cap, sát thương, khắc chế |\n| TST-02 | Unit | Determinism: cùng seed+lệnh → state hash giống |\n| TST-03 | Integration | Thứ tự phân giải lượt (SYS-02) và các EDGE-01..07 |\n| TST-04 | Integration | Tập kích: ETA/cảnh báo/đến kịp-hay-không |\n| TST-05 | Data | Validator `game-data/` + nhãn nguồn bắt buộc |\n| TST-06 | Save | Round-trip, migration giữa `save_version` |\n| TST-07 | E2E | Playwright: chơi hết CP1 bằng kịch bản; chạm & chuột |\n| TST-08 | Balance | Simulation hàng loạt: không chiến thuật thống trị, tỉ lệ thắng dải mục tiêu |\n| TST-09 | A11y/Perf | axe, tương phản, thời gian nạp, bundle size |\n| TST-10 | Manual | Playtest thực — ghi riêng khỏi build tự động |\nHồi quy: chạy toàn bộ trên mỗi thay đổi; không giả lập kết quả test.\n\n## Rủi ro kỹ thuật\n- Cân bằng auto-battle (TST-08). · Số liệu lịch sử (PIL-05). · Hiệu năng bản đồ trên mobile (đã giới hạn ~28 ô). · localStorage có thể bị chặn → cảnh báo + xuất file.\n", "kind": "md"}, {"group": "Thiết kế (G2)", "path": "docs/design/BASELINE_CANDIDATE.md", "text": "# Design Baseline Candidate — DB-0.1 (chờ G2)\n\nNgày: 2026-10-21 · Chưa được duyệt. Tài liệu: `docs/design/01..05`, `game-data/`, `docs/production/{ROADMAP.md,BACKLOG.yaml}`, dashboard `dashboard/index.html`.\nBằng chứng kiểm tra: `docs/qa/EVIDENCE_design_check.txt`.\n\n## Quyết định cần bạn xác nhận tại G2\n1. **Cách gộp**: MVP = CMP-01 (Lý–Tống) với A làm spine + C giản lược; CMP-02 và CMP-03 là bản sau MVP qua change request. (Bạn đã duyệt cả 3 concept; đây là thứ tự đề xuất.)\n2. **Không có phí kết thúc lượt**; áp lực bằng lịch chiến dịch (khác reference).\n3. **Thắng/Thua** (SYS-12) do dự án tự định nghĩa vì reference chưa rõ.\n4. **Stack**: TypeScript + Vite + SVG/DOM (phương án thay: Phaser/Godot web).\n5. **Tên \"Mandi\"**: vẫn chưa xác minh; chưa đưa vào thiết kế. Kẻ địch trong CMP-01 là lực lượng nhà Tống (trừu tượng hóa).\n6. Chấp nhận **tất cả số liệu là placeholder** đến khi simulation cân bằng (Phase 4).\n\n## Vấn đề chưa giải quyết\n- Chưa xem video reference; tần suất/độ mạnh tập kích và hậu quả thua của reference không có nguồn (thiết kế riêng thay thế).\n- Số liệu và chi tiết lịch sử chưa đối chiếu sử liệu gốc / chuyên gia → cần rà soát trước G3.\n- Dashboard mới kiểm tra cú pháp JS, chưa chạy trong trình duyệt.\n- Chưa có repo git, chưa có `project.code_repo`: cần bạn chỉ định (hoặc cho phép `git init` cục bộ) trước Phase 4.\n- Ước lượng thời gian chưa đưa ra.\n\n## Diff so với G1\nTừ 3 concept độc lập → 1 thiết kế phân lớp (A spine, C lớp chuẩn bị/thủy chiến, B hậu MVP). Không thêm tính năng ngoài các concept đã duyệt.\n", "kind": "md"}, {"group": "Sản xuất & phát hành", "path": "docs/production/ROADMAP.md", "text": "# Roadmap (đề xuất — chưa cam kết thời gian; ước lượng sau khi chốt G2)\n| Mốc | Nội dung | Features |\n|---|---|---|\n| M1 | Lõi sim + bản đồ + lượt + tài nguyên (vertical slice không UI đẹp) | FEAT-001..004 |\n| M2 | Công trình, quân, trận auto, UI bản đồ cơ bản → **vertical slice chơi được** | FEAT-005..007, 014 |\n| M3 | Tập kích/cảnh báo, tình báo, kế sách, xem trước trận, hoàn tác | FEAT-008..010, 015, 019 |\n| M4 | Sự kiện/ngoại giao CMP-01, tuyến sông, thắng/thua, lưu/nạp, a11y, màn nguồn | FEAT-011..013, 016..018 |\n| M5 | Release candidate (CMP-01) → **G3** | FEAT-020 + QA đầy đủ |\n| Post | CMP-02 (Trần–Nguyên), CMP-03 (Nam tiến) qua change request + rà soát sử học | — |\n", "kind": "md"}, {"group": "Sản xuất & phát hành", "path": "docs/change_requests/CR-001_balance_fixes_from_TST08.md", "text": "# CR-001 — Điều chỉnh thiết kế phát sinh từ bằng chứng TST-08 (Phase 4)\n\nNgày: 2026-10-21 · Baseline gốc: DB-0.1 (G2 đã duyệt) · Loại: **làm rõ/cân bằng**, không đổi phạm vi (vẫn MVP = CMP-01). Cần bạn xác nhận khi xem G3.\n\n## Vì sao\nBot mô phỏng (`tests/bots.ts`) cho thấy bản DB-0.1 nguyên trạng có chiến thuật thống trị: **dân binh đồn trú không giới hạn** giúp một ô thủ phủ chặn cả 5 đợt tập kích mà không mất quân và thắng nếu bỏ bớt kế sách. Tôi đã *không* giữ im lặng mà sửa như sau (dữ liệu: `docs/qa/balance_last.json`).\n\n## Thay đổi\n| ID | Thay đổi | Lý do |\n|---|---|---|\n| CR-001-a | **Trần đồn trú theo ô**: 4 (+4 thủ phủ) + 3 mỗi cấp lũy (SYS-05) | Chặn spam đồn trú |\n| CR-001-b | **Điều kiện đàm phán thắng**: giữ ≥3 khu định cư (ngoài ≥4 đợt chặn, Dân tâm ≥10, từ lượt 21, không còn đợt tập kích) (SYS-12) | Buộc mở rộng, hết \"turtle\" thắng |\n| CR-001-c | Trần công sự 0.40 (trước đó chỉ nêu \"tối đa\" chưa số); ô định cư thường có 4 ô xây (trước 3) | Cân bằng |\n| CR-001-d | Sản lượng cơ bản ×2; đợt 3–5: 9+6, 14+9, 19+12 (bộ binh + cung thủ địch) | Cân bằng, ~52% bot thắng |\n| CR-001-e | Lập khu định cư: +3 Dân tâm; đánh chiếm ô: +2; chặn tập kích: +3; mất ô: −5 | Quy định rõ (GDD chỉ nói \"Dân tâm từ…\") |\n| CR-001-f | Không có chi phí duy trì lương (GDD SYS-03 có nhắc \"tốn lương duy trì nhỏ\") | Không cần sau khi có trần đồn trú |\n\n## Chưa thay đổi / còn nợ\nEDGE-02, thủy triều, sự kiện lựa chọn, 12 ô → 28 ô (xem BACKLOG `note`).\n", "kind": "md"}, {"group": "Sản xuất & phát hành", "path": "docs/release/RC1.md", "text": "# Release Candidate RC1 — Dai Viet Rising (CMP-01 \"Hộ Quốc Tuyến\")\n\nNgày: 2026-10-21 · Baseline: DB-0.1 + CR-001 · Mục tiêu phát hành đề xuất: **web tĩnh (GitHub Pages)** — *chưa deploy, chờ G3*.\nBằng chứng chạy thật: `docs/qa/EVIDENCE_rc1.txt`, `docs/qa/balance_last.json`, `docs/qa/e2e-last.json`.\n\n## Gói\n`npm run build` → `dist/` (index.html + 1 JS 137 kB/gzip 44 kB + 1 CSS 2.8 kB), đường dẫn tương đối (`base './'`); đã kiểm tra phục vụ đúng dưới đường dẫn con bằng HTTP tĩnh cục bộ (200). **Chưa** kiểm tra trên GitHub Pages thật.\n\n## Kết quả kiểm thử (đã chạy)\n| Hạng mục | Kết quả |\n|---|---|\n| Typecheck (`tsc --noEmit`, trong `npm run build`) | đạt |\n| `tools/check_design.py` (truy vết dữ liệu/thiết kế) | OK: 40 ID, 12 ô, 20 feature |\n| Vitest: 48 test (sim, dữ liệu, xác định, lưu/nạp, combat, tập kích, controller, jsdom smoke, bot cân bằng) | 48/48 đạt |\n| Playwright Chromium 156: desktop + Pixel 7 cảm ứng, 10 kịch bản + axe | 19 đạt, 1 bỏ qua (bàn phím, chỉ desktop) |\n| Axe (serious/critical) | 0 vi phạm sau khi sửa label-content-name-mismatch |\n| Cân bằng bot 40 seed/chiến thuật | bỏ mặc 0%, turtle 0%, rải đều 0%, tập trung phòng thủ 52% (21/40), +tiến công 50% |\n| Quét `src/`: fetch/XHR/WebSocket/eval/innerHTML/secret | không có |\n| Giấy phép phụ thuộc chạy: `yaml` (ISC); không tài sản ngoài (không ảnh/âm thanh/font nhúng) | ổn |\n\nLỗi thật đã tìm và sửa nhờ test (không phải test giả): đồn trú vô hạn (thống trị), kinh tế quá mỏng, tràn ngang ở di động, quân đang hành quân không hiển thị, nhãn truy cập lệch.\n\n## Giới hạn đã biết (KHÔNG che giấu)\n1. **Chưa có playtest thủ công của người thật.** Chưa biết có vui, dễ hiểu hay đúng \"cảm giác\" hay không. Cần bạn chơi và phản hồi.\n2. Cân bằng chỉ qua bot ngây thơ; số liệu đều placeholder; người chơi giỏi có thể thắng dễ hơn/khó hơn 52%.\n3. Backlog: 13 done, 7 partial (xem `docs/production/BACKLOG.yaml` `note`): thiếu EDGE-02, sự kiện lựa chọn, thủy triều/nhử, chỉ ~3 kế sách, 12 ô thay vì ~28, chưa thử screen reader thật, chưa chỉnh cỡ chữ.\n4. Lịch sử: chỉ khung chiến dịch có nguồn (Wikipedia tiếng Anh, chưa thẩm định sử học); toàn bộ địa danh/quân số là hư cấu có nhãn. **Cần rà soát sử học trước khi công bố rộng.**\n5. Reference (Demacia Rising) chưa xem video; \"Mandi\" chưa xác minh (không đưa vào game).\n6. Đã thử trên Chromium duy nhất; Firefox/Safari/thiết bị thật chưa thử. Không có đo hiệu năng riêng ngoài thời gian chạy test.\n7. Lưu = localStorage + xuất/nhập JSON; chưa có test migration giữa nhiều phiên bản (chỉ v1).\n8. Không có âm thanh, hình ảnh nghệ thuật, hay lồng tiếng (MVP).\n\n## Quyết định cần từ bạn tại G3\n- **G3 chỉ cấp phép phát hành tới đích bạn nêu rõ** (ví dụ: \"GitHub Pages của repo X, nhánh gh-pages\"). Hiện chưa có remote/repo đích; tôi *không* push hay deploy khi chưa có xác nhận.\n- Xác nhận CR-001 (docs/change_requests).\n- Có chấp nhận phát hành với các giới hạn trên, hay muốn làm thêm (playtest, sự kiện lựa chọn, thủy triều CMP-02…) trước.\n\n## Rollback\nBản phát hành là tệp tĩnh: rollback = redeploy `dist/` của commit trước (git tag `rc1` đặt cục bộ).\n", "kind": "md"}, {"group": "Bằng chứng QA", "path": "docs/qa/EVIDENCE_design_check.txt", "text": "ids=24 tiles=6 features=20 design_ids_checked=31 tests=10\nOK\nexit=0\n\n# Lệnh đã chạy (2026-10-21)\n1. python3 -I tools/check_design.py            -> OK (ở trên)\n2. python3 -I tools/build_dashboard.py         -> docs=23 features=20 bytes=58477\n3. node: kiểm tra cú pháp JS trong dashboard/index.html (new Function) -> \"JS syntax OK\"\n4. Negative test: bản sao tạm với FEAT-001 trỏ SYS-99 -> check_design.py FAIL, exit=1 (bắt đúng lỗi)\n# CHƯA làm: mở dashboard trong trình duyệt thật / kiểm tra a11y tự động / mobile; chưa có code game nên không có test gameplay.\n", "kind": "yaml"}, {"group": "Bằng chứng QA", "path": "docs/qa/EVIDENCE_rc1.txt", "text": "# EVIDENCE RC1 — 2026-10-21T10:03:33Z\nnode v24.22.0 npm 11.19.1\n\n$ npm run typecheck\n\n> daiviet-rising@0.1.0 typecheck\n> tsc --noEmit\n\nexit=0\n\n$ npm run check:design\nids=40 tiles=12 features=20 design_ids_checked=31 tests=10\nOK\nexit=0\n\n$ npx vitest run\n\n RUN  v5.0.5 /data/yuu/ai-data/yuu/self/dev/daiviet-rising\n\n\n Test Files  3 passed (3)\n      Tests  48 passed (48)\n   Start at  17:03:35\n   Duration  5.95s (import 88%, environment 8%, tests 3%, transform 1%)\n\n\n$ npm run build\n\n> daiviet-rising@0.1.0 build\n> tsc --noEmit && vite build\n\nvite v8.3.5 building client environment for production...\ntransforming...\n✓ 91 modules transformed.\nrendering chunks...\ncomputing gzip size...\ndist/index.html                   0.42 kB │ gzip:  0.30 kB\ndist/assets/index-DWV68azE.css    2.83 kB │ gzip:  1.19 kB\ndist/assets/index-DJyN9y_P.js   137.42 kB │ gzip: 43.73 kB\n\n✓ built in 151ms\n\n$ npx playwright test (desktop + mobile-touch, Chromium 156)\n  ✓   2 [desktop] › e2e/game.spec.ts:11:1 › TST-07 tải trang: 12 ô, không lỗi console, tiếng Việt (225ms)\n  ✓   1 [mobile-touch] › e2e/game.spec.ts:11:1 › TST-07 tải trang: 12 ô, không lỗi console, tiếng Việt (224ms)\n  ✓   4 [mobile-touch] › e2e/game.spec.ts:20:1 › chọn ô → xây → huấn luyện → const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" rel="noopener">$1</a>');
function md(t){const L=t.split('\n');let o='',i=0,ul=false;const cl=()=>{if(ul){o+='</ul>';ul=false}};
while(i<L.length){let l=L[i];
 if(/^```/.test(l)){cl();let b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;o+='<pre>'+esc(b.join('\n'))+'</pre>';continue}
 if(/^\|/.test(l)&&/^\|[\s:|-]+\|?$/.test(L[i+1]||'')){cl();const row=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());o+='<table><tr>'+row(l).map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr>';i+=2;while(i<L.length&&/^\|/.test(L[i]))o+='<tr>'+row(L[i++]).map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>';o+='</table>';continue}
 let m=l.match(/^(#{1,4})\s+(.*)/);if(m){cl();o+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;i++;continue}
 if(/^\s*[-*]\s+/.test(l)){if(!ul){o+='<ul>';ul=true}o+='<li>'+inl(l.replace(/^\s*[-*]\s+/,''))+'</li>';i++;continue}
 cl();if(l.trim())o+='<p>'+inl(l)+'</p>';i++}cl();return o}
function trace(){const rows=D.backlog.map(f=>`<tr><td>${f.id}</td><td>${esc(f.title)}</td><td>${f.design.join(', ')}</td><td>${f.tests.join(', ')}</td><td>${f.milestone}</td><td>${f.status}</td></tr>`).join('');
 return '<h2>Truy vết Feature → Design → Test</h2><table><tr><th>Feature</th><th>Tiêu đề</th><th>Design IDs</th><th>Tests</th><th>Mốc</th><th>Trạng thái</th></tr>'+rows+'</table>'}
const st=D.docs.find(d=>d.path==='state/STATUS.md').text;document.getElementById('gate').textContent=(st.match(/^Gate:\s*(.*)$/m)||[,'?'])[1].replace(/\*/g,'').slice(0,60);
let cur=null;
function show(p){cur=p;const v=document.getElementById('view');
 if(p==='#trace'){v.innerHTML='<div class="note">Dữ liệu từ docs/production/BACKLOG.yaml. Trạng thái "todo" = chưa có code; chưa có build/test gameplay.</div>'+trace()}
 else{const d=D.docs.find(x=>x.path===p);v.innerHTML=d.kind==='yaml'?'<pre>'+esc(d.text)+'</pre>':md(d.text)}
 v.focus();draw()}
function draw(){const q=document.getElementById('q').value.toLowerCase();let h='<h2>Tổng quan</h2><a href="#" data-p="#trace" '+(cur==='#trace'?'aria-current="true"':'')+'>Truy vết backlog</a>',g='';
 for(const d of D.docs){if(q&&!(d.text.toLowerCase().includes(q)||d.path.toLowerCase().includes(q)))continue;if(d.group!==g){g=d.group;h+='<h2>'+esc(g)+'</h2>'}h+=`<a href="#" data-p="${d.path}" ${cur===d.path?'aria-current="true"':''}>${d.path}</a>`}
 document.getElementById('list').innerHTML=h}
document.getElementById('list').addEventListener('click',e=>{const a=e.target.closest('a[data-p]');if(a){e.preventDefault();show(a.dataset.p)}});
document.getElementById('q').addEventListener('input',draw);
show('docs/concepts/PROPOSAL.md');
