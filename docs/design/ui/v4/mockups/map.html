<script>
const filt = `<filter id="inkr" x="-5%" y="-10%" width="110%" height="130%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" result="d"/><feDropShadow in="d" dx="1.5" dy="3" stdDeviation="2.2" flood-color="#1b1208" flood-opacity=".6"/></filter>
<filter id="glowf" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>`;
function labelLayer(opts = {}) {
  const P = (n) => TILES[id3(n)].p; let s = '';
  const path = (a, b) => ROADS[a + '-' + b] ? ROADS[a + '-' + b] : ROADS[b + '-' + a].slice().reverse();
  // đường tập kích 12 -> 8 -> 5 (theo đúng đường đã vẽ trong tranh nền)
  if (opts.alert !== false) { const pts = [...path(12, 8), ...path(8, 5)].map((p) => p.join(',')).join(' '); s += `<polyline points="${pts}" stroke="#7b1f17" stroke-width="9" fill="none" opacity=".45" stroke-linecap="round" stroke-linejoin="round" transform="translate(2,3)"/><polyline points="${pts}" stroke="#b0372a" stroke-width="6" fill="none" stroke-dasharray="14 9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>`; }
  const sel = opts.sel === undefined ? 'TIL-001' : opts.sel;
  const order = Object.keys(TILES).sort((a, b) => TILES[a].p[1] - TILES[b].p[1]);
  for (const id of order) {
    const [x, y] = TILES[id].p, st = TILES[id].s;
    if (sel === id) s += `<ellipse cx="${x}" cy="${y + 6}" rx="104" ry="58" fill="rgba(255,226,140,.18)" stroke="#f6dc8a" stroke-width="4"/><ellipse cx="${x}" cy="${y + 6}" rx="104" ry="58" fill="none" stroke="#3b2a1c" stroke-width="1.6" stroke-dasharray="8 6"/>`;
    const kind = st === 'settled' ? 'own' : st === 'open' ? 'open' : 'enemy';
    s += `<g filter="url(#inkr)">${banner(x, y + 54, TILES[id].n, kind)}</g>`;
